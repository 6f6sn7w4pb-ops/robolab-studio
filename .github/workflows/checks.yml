name: Lightweight checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Standard-library contracts (no models, no GPU)
        run: |
          python -m unittest discover -s tests -p 'test_schema.py' -v
          python -m unittest discover -s tests -p 'test_p2_recording.py' -v
          python -m unittest discover -s tests -p 'test_runtime.py' -v
          for script in scripts/*.sh; do bash -n "$script"; done
